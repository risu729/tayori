name: Bootstrap
# Temporary, one manual run. The Worker was created once through the script API
# (docs/design.md#deployment), and `cf workers versions create` in CI refuses to
# replace a Worker last updated that way. This run replaces it with the checked
# main commit through `cf deploy --force`, which also attaches the Custom Domain.
# Remove this workflow once the normal Deploy Worker job succeeds.
on:
  workflow_dispatch:
permissions: {}
defaults:
  run:
    shell: bash
concurrency:
  group: ci-CI-refs/heads/main
  cancel-in-progress: false
jobs:
  bootstrap:
    name: Replace the script API placeholder
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked tools
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.10
          install_args: --locked
          cache: "false"
      # Install the locked dependencies before any step that holds the token.
      - name: Install locked dependencies
        run: mise deps
      - name: Build and validate the production Worker
        run: mise run check:output
      - name: Deploy once over the placeholder
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CI: "true"
        run: node_modules/.bin/cf deploy --prebuilt --mode production --worker tayori --force
